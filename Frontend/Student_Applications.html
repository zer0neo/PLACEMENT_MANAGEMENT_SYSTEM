<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CampusHire - My Applications</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="Student_Applications.css">
</head>

<body>

<div class="container">

    <div class="grid-overlay"></div>
    <div class="glow glow-top"></div>
    <div class="glow glow-bottom"></div>

    <div class="dashboard-card">

        <p class="eyebrow">
            STUDENT PORTAL
        </p>

        <h1>
            My <span>Applications</span>
        </h1>

        <p class="subtitle">
            Track all jobs you have applied for and monitor your application status.
        </p>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Job Title</th>
                        <th>Company Name</th>
                        <th>Date Applied</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td>Software Engineer</td>
                        <td>TCS</td>
                        <td>12 Aug 2026</td>
                        <td>
                            <span class="status pending">
                                Pending
                            </span>
                        </td>
                    </tr>

                    <tr>
                        <td>Frontend Developer</td>
                        <td>Infosys</td>
                        <td>10 Aug 2026</td>
                        <td>
                            <span class="status shortlisted">
                                Shortlisted
                            </span>
                        </td>
                    </tr>

                    <tr>
                        <td>AI Engineer</td>
                        <td>Wipro</td>
                        <td>08 Aug 2026</td>
                        <td>
                            <span class="status accepted">
                                Accepted
                            </span>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="Student_Applications.js"></script>

</body>
</html>
