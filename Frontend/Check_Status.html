<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="Check_Status.css">
</head>

<body>

<div class="container">

    <div class="grid-overlay"></div>
    <div class="glow glow-top"></div>
    <div class="glow glow-bottom"></div>

    <div class="dashboard-card">

        <p class="eyebrow">
            RECRUITER PORTAL

        <h1>
            Applicant <span>Status</span>

        <p class="subtitle">

            <table>

                        <th>CGPA</th>

                <tbody id="studentTableBody">

                    <!-- Database Records Will Load Here -->

                </tbody>

            </table>

    </div>
