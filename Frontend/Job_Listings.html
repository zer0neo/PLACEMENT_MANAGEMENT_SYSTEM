<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CampusHire - Available Jobs</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="Job_Listings.css">
</head>

<body>

<div class="container">

    <div class="grid-overlay"></div>
    <div class="glow glow-top"></div>
    <div class="glow glow-bottom"></div>

    <div class="dashboard-card">

        <p class="eyebrow">
            PLACEMENT OFFICER PORTAL
        </p>

        <h1>
            Available <span>Jobs</span>
        </h1>

        <p class="subtitle">
            Browse current placement opportunities and apply for jobs that match your profile.
        </p>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Minimum CGPA</th>
                        <th>Deadline</th>
                        <th>Company Name</th>
                    </tr>
                </thead>

                <tbody id="jobTableBody">

                    <!-- Database Records Will Load Here -->

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="Job_Listings.js"></script>

</body>
</html>
