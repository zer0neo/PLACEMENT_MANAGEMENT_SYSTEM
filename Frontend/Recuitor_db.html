<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusHire - Recruiter Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="Re_db.css">
</head>
<body>

<div class="container">

    <div class="grid-overlay"></div>
    <div class="glow glow-top"></div>
    <div class="glow glow-bottom"></div>

    <!-- ✅ FIX: Button moved here, directly inside .container (which has position:relative) -->
    <a href="Check_Status.html">
    <button class="status-btn" onclick="checkStatus()">
        Check Status →
    </button>
    </a>

    <div class="scrolling-container">
        <div class="scrolling-text">
            🚀 CampusHire Recruiter Portal • Post Jobs • Find Top Talent • Hire Skilled Students •
        </div>
    </div>

    <div class="card">

        <p class="eyebrow">RECRUITER PORTAL</p>

        <h1>
            Create <span>Job Posting</span>
        </h1>

        <p class="subtitle">
            Publish opportunities and connect with talented students
            across the campus placement network.
        </p>

        <form id="jobForm">

            <div class="form-group">
                <label>Company Name</label>
                <input
                    type="text"
                    id="company"
                    class="form-input"
                    placeholder="Enter company name">
            </div>

            <div class="form-group">
                <label>Job Title</label>
                <input
                    type="text"
                    id="title"
                    class="form-input"
                    placeholder="Software Engineer">
            </div>

            <div class="form-group">
                <label>Job Description</label>
                <textarea
                    id="description"
                    class="form-input textarea"
                    placeholder="Describe the role, responsibilities and requirements..."></textarea>
            </div>

            <div class="row">

                <div class="form-group">
                    <label>Minimum CGPA</label>
                    <input
                        type="number"
                        id="cgpa"
                        min="0"
                        max="10"
                        step="0.01"
                        class="form-input"
                        placeholder="7.00">
                </div>

                <div class="form-group">
                    <label>Deadline</label>
                    <input
                        type="date"
                        id="deadline"
                        class="form-input">
                </div>

            </div>

            <button type="submit" class="submit-btn">
                Publish Job →
            </button>

        </form>

    </div>

</div>

<script src="Re_js.js"></script>

</body>
</html>
